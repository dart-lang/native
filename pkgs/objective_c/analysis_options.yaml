include: package:dart_flutter_team_lints/analysis_options.yaml

analyzer:
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**
    - example/flutter_app/**
    - example/path_provider_example/**
  language:
    strict-raw-types: true

linter:
  rules:
    unawaited_futures: true
    discarded_futures: true
