name: maven_libs_groovy_example
description: "Demonstrates how to use the maven_libs_groovy plugin."
publish_to: 'none'

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter
  maven_libs_groovy:
    path: ../
  cupertino_icons: ^1.0.8
dependency_overrides:
  code_assets:
    path: ../../../../code_assets
  ffigen:
    path: ../../../../ffigen
  hooks:
    path: ../../../../hooks
  jni:
    path: ../../../../jni
  jni_util:
    path: ../../../../jni_util
  native_toolchain_c:
    path: ../../../../native_toolchain_c
  record_use:
    path: ../../../../record_use

dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
