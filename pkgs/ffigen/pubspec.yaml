name: ffigen
version: 23.1.0-wip
description: >
  Generator for FFI bindings, using LibClang to parse C, Objective-C, and Swift
  files.
repository: https://github.com/dart-lang/native/tree/main/pkgs/ffigen
issue_tracker: https://github.com/dart-lang/native/issues?q=is%3Aissue+is%3Aopen+label%3Apackage%3Affigen

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  args: ^2.4.2
  cli_config: '>=0.1.0 <0.3.0'
  collection: ^1.18.0
  glob: ^2.1.2
  logging: ^1.2.0
  meta: ^1.12.0
  package_config: ^2.1.0
  path: ^1.9.0
  pub_semver: ^2.1.4
  pubspec_parse: ^1.2.3
  quiver: ^3.2.1
  yaml: ^3.1.2

dev_dependencies:
  code_assets:
    path: ../code_assets
  dart_flutter_team_lints: ^3.2.1
  ffigen_header_test:
    path: test/header_test
  hooks:
    path: ../hooks
  json_schema: ^5.1.3
  lints: ^4.0.0
  native_test_helpers:
    path: ../native_test_helpers
  native_toolchain_c:
    path: ../native_toolchain_c
  test: ^1.25.2
  yaml_edit: ^2.2.0
