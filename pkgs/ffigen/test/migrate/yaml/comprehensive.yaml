name: Comprehensive
description: 'Comprehensive bindings'
output:
  bindings: 'comprehensive_bindings.dart'
  objc-bindings: 'comprehensive_bindings.m'
  symbol-file:
    output: 'comprehensive_symbols.yaml'
    import-path: 'comprehensive_bindings.dart'
headers:
  entry-points:
    - 'comprehensive.h'
  include-directives:
    - '**comprehensive.h'
compiler-opts: '-Wno-nullability-completeness'
compiler-opts-automatic:
  macos:
    include-c-standard-library: true
ignore-source-errors: true
comments:
  style: any
  length: full
preamble: |
  // Comprehensive test preamble
language: objc
external-versions:
  ios:
    min: 12.0.0
  macos:
    min: 10.14.0
sort: true
use-supported-typedefs: true
silence-enum-warning: true
include-unused-typedefs: true
include-transitive-objc-categories: false
library-imports:
  custom_lib: 'package:custom_lib/custom_lib.dart'
type-map:
  typedefs:
    mapped_typedef_t:
      lib: custom_lib
      c-type: Int32
      dart-type: int

functions:
  include:
    - 'regular_func'
    - 'regex_.*'
    - '.*'
  exclude:
    - 'func_exclude'
    - 'regex_exclude_.*'
  rename:
    'old_func': 'new_func'
    'prefix_func_.*': 'new_prefix'
    'strip_(.*)': '$1'
    'swap_(.*)_(.*)': '$2_$1'
  member-rename:
    func_param_rename:
      old_param: new_param
    func_regex_param_rename:
      'prefix_param_.*': 'new_param'
      'swap_(.*)_(.*)': '$2_$1'
  leaf:
    include:
      - 'leaf_func'
      - 'leaf_regex_.*'
  symbol-address:
    include:
      - 'sym_addr_func'
      - 'sym_addr_regex_.*'
  expose-typedefs:
    include:
      - 'exp_typedef_func'
      - 'exp_typedef_regex_.*'

structs:
  include:
    - 'RegularStruct'
    - 'RegexStruct.*'
    - '.*'
  exclude:
    - 'ExcludedStruct'
    - 'RegexExcludedStruct.*'
    - 'OpaqueDepStruct'
  rename:
    'StructRenameNoGroup': 'RenamedStructNoGroup'
    'RegexStructNoGroup_.*': 'RenamedRegexStruct'
    'StripStruct_(.*)': '$1'
    'Swap_Struct_(.*)_(.*)': '$2_$1'
  member-rename:
    FieldRenameStruct:
      old_field: new_field
    RegexFieldStruct:
      'prefix_field_.*': 'renamed_field'
      'swap_(.*)_(.*)': '$2_$1'
  pack:
    Pack1Struct: 1
    Pack2Struct: 2
    Pack4Struct: 4
    Pack8Struct: 8
    Pack16Struct: 16
    PackNoneStruct: 'none'
  dependency-only: opaque

unions:
  include:
    - 'RegularUnion'
    - 'RegexUnion.*'
    - '.*'
  exclude:
    - 'ExcludedUnion'
    - 'RegexExcludedUnion.*'
    - 'OpaqueDepUnion'
  rename:
    'UnionOld': 'UnionNew'
  member-rename:
    FieldRenameUnion:
      old_field: new_field
      'prefix_field_.*': 'renamed_field'
      'swap_(.*)_(.*)': '$2_$1'
  dependency-only: opaque

enums:
  include:
    - 'RegularEnum'
    - 'RegexEnum.*'
    - '.*'
  exclude:
    - 'ExcludedEnum'
    - 'RegexExcludedEnum.*'
  rename:
    'EnumOld': 'EnumNew'
  member-rename:
    MemberRenameEnum:
      OLD_CONST: NEW_CONST
    RegexMemberRenameEnum:
      'OLD_PREFIX_.*': 'NEW_PREFIX'
      'SWAP_(.*)_(.*)': '$2_$1'
  as-int:
    include:
      - 'AsIntEnum'
      - 'AsIntRegex.*'

unnamed-enums:
  include:
    - 'UNNAMED_OLD_CONST'
    - 'UNNAMED_.*'
    - '.*'
  exclude:
    - 'UNNAMED_EXCLUDED'
    - 'UNNAMED_REGEX_EXCLUDED_.*'
  rename:
    UNNAMED_OLD_CONST: UNNAMED_NEW_CONST
    'UNNAMED_PREFIX_(.*)': 'UNNAMED_STRIP_$1'
  as-int:
    include:
      - '.*'

globals:
  include:
    - 'regular_global'
    - 'prefix_.*'
    - '.*'
  exclude:
    - 'excluded_global'
    - 'regex_excluded_.*'
  rename:
    'prefix_global_test': 'renamed_global_test'
    'prefix_global_(.*)': 'global_$1'
  symbol-address:
    include:
      - 'sym_addr_global'
      - 'sym_addr_regex_.*'

macros:
  include:
    - 'MACRO_EXACT'
    - 'MACRO_.*'
    - '.*'
  exclude:
    - 'MACRO_EXCLUDE'
    - 'MACRO_REGEX_EXCLUDE_.*'
  rename:
    MACRO_EXACT: MACRO_NEW_EXACT
    'MACRO_PREFIX_(.*)': 'MACRO_STRIP_$1'

typedefs:
  include:
    - 'old_typedef_t'
    - 'regex_.*'
    - '.*'
  exclude:
    - 'excluded_typedef'
    - 'regex_excluded_.*'
  rename:
    old_typedef_t: new_typedef_t
    'regex_prefix_(.*)': 'regex_strip_$1'

objc-interfaces:
  include:
    - 'ComprehensiveInterface'
    - 'RegexInterface.*'
    - '.*'
  exclude:
    - 'ExcludedInterface'
    - 'RegexExcludedInterface.*'
  rename:
    'InterfaceOld': 'InterfaceNew'
  member-filter:
    ComprehensiveInterface:
      exclude:
        - 'filteredMethod'
        - 'regexFiltered.*'
  member-rename:
    ComprehensiveInterface:
      'oldMethodName': 'newMethodName'
      'prefixMethod_.*': 'newPrefixMethod'
      'swap_(.*)_(.*)': '$2_$1'
  module:
    ComprehensiveInterface: 'ComprehensiveModule'

objc-protocols:
  include:
    - 'ComprehensiveProtocol'
    - 'RegexProtocol.*'
    - '.*'
  exclude:
    - 'ExcludedProtocol'
    - 'RegexExcludedProtocol.*'
  rename:
    'ProtocolOld': 'ProtocolNew'
  member-filter:
    ComprehensiveProtocol:
      exclude:
        - 'protoFilteredMethod'
        - 'protoRegexFiltered.*'
  module:
    ComprehensiveProtocol: 'ComprehensiveModule'

objc-categories:
  include:
    - 'ComprehensiveCategory'
    - 'RegexCategory.*'
    - '.*'
  exclude:
    - 'ExcludedCategory'
    - 'RegexExcludedCategory.*'
  rename:
    'CategoryOld': 'CategoryNew'
  member-filter:
    ComprehensiveCategory:
      exclude:
        - 'catFilteredMethod'
        - 'catRegexFiltered.*'
  member-rename:
    ComprehensiveCategory:
      'catOldMethodName': 'catNewMethodName'
      'catPrefixMethod_.*': 'catNewPrefixMethod'
