name: ComprehensiveCNative
description: 'Comprehensive C Native bindings'
output: 'comprehensive_c_native_bindings.dart'
ffi-native:
  asset-id: 'package:ffigen/c_native_test'
headers:
  entry-points:
    - 'comprehensive_c_native.h'
compiler-opts:
  - '-I.'
exclude-all-by-default: true
comments: false
functions:
  include:
    - 'add'
  leaf: true
