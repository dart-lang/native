# Bindings are frozen at jnigen 0.16.0. To regenerate:
#   flutter build apk --debug
#   dart run jnigen --config jnigen.yaml

android_sdk_config:
  add_gradle_deps: true
  android_example: '.'

class_path:
  - 'build/app/intermediates/javac/debug/compileDebugJavaWithJavac/classes'
  - 'build/app/tmp/kotlin-classes/debug'

classes:
  - 'com.github.dart_lang.jni.legacy'
  - 'android.content.Context'

output:
  dart:
    path: 'lib/legacy_bindings.g.dart'
    structure: single_file

