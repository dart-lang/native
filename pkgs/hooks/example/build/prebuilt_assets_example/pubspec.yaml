name: prebuilt_assets_example
description: Sums two numbers with native code, bundling prebuilt assets in pub package.
version: 0.1.2
repository: https://github.com/dart-lang/native/tree/main/pkgs/hooks/example/build/prebuilt_assets_example

resolution: workspace

environment:
  sdk: '>=3.10.0 <4.0.0'

dependencies:
  code_assets: ^2.0.0
  hooks: ^2.0.0
  native_toolchain_c: ^0.19.0

dev_dependencies:
  args: ^2.6.0
  ffigen: ^22.0.0
  lints: ^6.0.0
  test: ^1.25.15

# Note: If pub workspaces are in use, the user-defines must be in the workspace
# pub file. These defines are only in effect if `resolution: workspace` above is
# removed.
hooks:
  user_defines:
    prebuilt_assets_example: # package name
      local_build: false
