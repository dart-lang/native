# A CI configuration to publish packages to pub.dev.

name: Publish

on:
  push:
    tags:
      - '*-v[0-9]+.[0-9]+.[0-9]+*'
      - '!ffigen-v*'
      - '!jni-v*'
      - '!jnigen-v*'
      - '!objective_c-v*'
      - '!prebuilt_assets_example-v*'

jobs:
  publish:
    if: ${{ github.repository_owner == 'dart-lang' }}
    permissions:
      id-token: write
    uses: dart-lang/setup-dart/.github/workflows/publish.yml@40657d0d0732d6fd3809f5841380e7519e355b50 # main
    with:
      working-directory: pkgs/{package}
      use-flutter: ${{ startsWith(github.ref_name, 'jni_flutter-') }}
